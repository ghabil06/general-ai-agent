name: prompt-eval

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Gate 1 — always runs, needs no secrets, costs nothing.
  # Catches a dataset that contradicts itself, a prompt that lost its
  # placeholder, and a config that points at a missing file — for both agents.
  dataset-gate:
    name: Dataset & config consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: SVC_03 dataset & config
        run: node evals/validate_dataset.mjs

      - name: SVC_04 dataset & config
        run: node evals/validate_security_dataset.mjs

      - name: SVC_06 dataset & config
        run: node evals/validate_trading_dataset.mjs

  # Gate 1b — the n8n export cannot execute here, so CI lints its structure
  # (guardrail present, writes disabled, audit sink reachable) and executes
  # its embedded Code nodes against adversarial inputs.
  n8n-export-gate:
    name: n8n export lint & logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint workflow structure
        run: node n8n_exports/validate_workflow.mjs

      - name: Execute the workflow's Code nodes against adversarial inputs
        run: node n8n_exports/test_parse_nodes.mjs

      - name: Shadow-week replay tool dry-run (example input stays valid)
        run: node n8n_exports/replay_history.mjs --dry-run --file n8n_exports/replay_sample.jsonl

  # Gate 2 — proves the assertions can still fail, for every agent. Each
  # service runs its deliberately broken fixture and requires its exact
  # predicted failure count, plus a 12/12 oracle. If a broken fixture ever
  # goes green, the eval has stopped testing anything.
  harness-discriminates:
    name: Offline harness (must FAIL on purpose)
    runs-on: ubuntu-latest
    needs: dataset-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: SVC_03 invoice agent
            offline_config: evals/promptfooconfig.offline.yaml
            broken_provider: naive
            oracle_provider: oracle
            expected_failures: 9
            results_file: naive-results.json
            oracle_results_file: oracle-results.json
          - service: SVC_04 security triage agent
            offline_config: evals/promptfooconfig.offline.security.yaml
            broken_provider: naive_analyst
            oracle_provider: oracle_security
            expected_failures: 7
            results_file: naive-security-results.json
            oracle_results_file: oracle-security-results.json
          - service: SVC_06 paper trading agent
            offline_config: evals/promptfooconfig.offline.trading.yaml
            broken_provider: naive_trader
            oracle_provider: oracle_trading
            expected_failures: 9
            results_file: naive-trading-results.json
            oracle_results_file: oracle-trading-results.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: '${{ matrix.service }}: broken fixture must fail exactly ${{ matrix.expected_failures }}/12'
        env:
          PROMPTFOO_DISABLE_TELEMETRY: '1'
          PROMPTFOO_DISABLE_UPDATE: '1'
          PROMPTFOO_DISABLE_SHARE: '1'
        # promptfoo exits 100 when any test fails, which is the expected
        # outcome here, so its exit code is swallowed and check_results.mjs
        # makes the real assertion on the exact failure count.
        run: |
          rm -f "${{ matrix.results_file }}"
          npx promptfoo eval \
            -c "${{ matrix.offline_config }}" \
            --filter-providers "${{ matrix.broken_provider }}" \
            --no-cache --no-table -o "${{ matrix.results_file }}" || true
          node evals/check_results.mjs "${{ matrix.results_file }}" \
            --expect-failures "${{ matrix.expected_failures }}" --total 12

      - name: '${{ matrix.service }}: oracle fixture must pass 12/12'
        env:
          PROMPTFOO_DISABLE_TELEMETRY: '1'
          PROMPTFOO_DISABLE_UPDATE: '1'
          PROMPTFOO_DISABLE_SHARE: '1'
        run: |
          rm -f "${{ matrix.oracle_results_file }}"
          npx promptfoo eval \
            -c "${{ matrix.offline_config }}" \
            --filter-providers "${{ matrix.oracle_provider }}" \
            --no-cache --no-table -o "${{ matrix.oracle_results_file }}" || true
          node evals/check_results.mjs "${{ matrix.oracle_results_file }}" --expect-failures 0 --total 12

  # Gate 3 — the real thing. Only runs when model API keys are configured as
  # repo secrets, so forks and PRs from branches without secrets stay green.
  llm-eval:
    name: Live model eval
    runs-on: ubuntu-latest
    needs: dataset-gate
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check for model API keys
        id: keys
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No OPENAI_API_KEY / ANTHROPIC_API_KEY secret configured — skipping the live model eval."
          fi

      - name: Run promptfoo eval (SVC_03 invoice agent)
        if: steps.keys.outputs.present == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPTFOO_DISABLE_TELEMETRY: '1'
          PROMPTFOO_DISABLE_UPDATE: '1'
          PROMPTFOO_DISABLE_SHARE: '1'
        run: |
          # promptfoo exits 100 on any assertion failure, which is what we
          # want to gate on, so let its exit code stand and only swallow the
          # 100 case after the results file has been written.
          npx promptfoo eval -c promptfooconfig.yaml --no-cache --no-table -o eval-results.json || true
          node evals/check_results.mjs eval-results.json --require-all-pass

      - name: Run promptfoo eval (SVC_04 security triage agent)
        if: steps.keys.outputs.present == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPTFOO_DISABLE_TELEMETRY: '1'
          PROMPTFOO_DISABLE_UPDATE: '1'
          PROMPTFOO_DISABLE_SHARE: '1'
        run: |
          npx promptfoo eval -c promptfooconfig.security.yaml --no-cache --no-table -o eval-results-security.json || true
          node evals/check_results.mjs eval-results-security.json --require-all-pass

      - name: Run promptfoo eval (SVC_06 paper trading agent)
        if: steps.keys.outputs.present == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPTFOO_DISABLE_TELEMETRY: '1'
          PROMPTFOO_DISABLE_UPDATE: '1'
          PROMPTFOO_DISABLE_SHARE: '1'
        run: |
          npx promptfoo eval -c promptfooconfig.trading.yaml --no-cache --no-table -o eval-results-trading.json || true
          node evals/check_results.mjs eval-results-trading.json --require-all-pass

      - uses: actions/upload-artifact@v4
        if: always() && steps.keys.outputs.present == 'true'
        with:
          name: eval-results
          path: |
            eval-results.json
            eval-results-security.json
            eval-results-trading.json
